name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ps
          POSTGRES_PASSWORD: ps
          POSTGRES_DB: ps_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ps" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_CLIENT: ${{ matrix.db }}
      TEST_DATABASE_URL: postgres://ps:ps@localhost:5432/ps_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
