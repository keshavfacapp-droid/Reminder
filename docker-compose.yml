# Private Space — fully self-hosted stack. Every image is open source:
#   frontend : Caddy (Apache-2.0) serving the PWA + automatic HTTPS
#   backend  : Node.js API + WebSocket server (this repository)
#   db       : PostgreSQL (PostgreSQL License)
#
#   cp .env.example .env   # then edit it
#   docker compose up -d --build

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: private_space
      POSTGRES_USER: private_space
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U private_space -d private_space']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_CLIENT: postgres
      DATABASE_URL: postgres://private_space:${POSTGRES_PASSWORD}@db:5432/private_space
      PUBLIC_ORIGIN: https://${DOMAIN:-localhost}
      TRUST_PROXY: '1'
      COOKIE_SECURE: 'true'
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-168}
      SESSION_ABSOLUTE_DAYS: ${SESSION_ABSOLUTE_DAYS:-30}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      MAX_PHOTO_MB: ${MAX_PHOTO_MB:-30}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-500}
      MAX_DOCUMENT_MB: ${MAX_DOCUMENT_MB:-100}
      LINK_PREVIEWS: ${LINK_PREVIEWS:-true}
    volumes:
      # Private uploads live in a named volume, never in a web-served directory.
      - storage:/data/storage
    networks: [internal, egress]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on: [backend]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
      MAX_REQUEST_BODY: ${MAX_REQUEST_BODY:-600MB}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal, egress]

networks:
  internal:
    internal: true
  egress: {}

volumes:
  db-data:
  storage:
  caddy-data:
  caddy-config:
